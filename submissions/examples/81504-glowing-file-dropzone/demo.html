<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Glowing File Dropzone demonstration.">
    <title>Glowing File Dropzone | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="demo" aria-labelledby="demo-title">
      <header>
        <p>EaseMotion CSS component</p>
        <h1 id="demo-title">Glowing File Dropzone</h1>
        <p>Choose a file or focus the dropzone to preview its glowing interaction states.</p>
      </header>
      <section aria-label="File upload preview">
        <label class="dropzone" for="file-input">
          <input id="file-input" type="file" aria-describedby="dropzone-help">
          <span class="dropzone-content">
            <span class="dropzone-icon" aria-hidden="true">↑</span>
            <strong>Choose a file</strong>
            <span id="dropzone-help">Click here to browse your device</span>
          </span>
        </label>
      </section>
      <footer>
        <p>The visual treatment is handled by CSS while the browser manages file selection.</p>
      </footer>
    </main>
  </body>
</html>
