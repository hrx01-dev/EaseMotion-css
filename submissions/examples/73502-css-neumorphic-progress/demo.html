<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neumorphic Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">EaseMotion · #73502</p>
    <section class="card">
      <h1>Neumorphic Progress</h1>
      <div class="progress" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64">
        <span style="--value: 64%"></span>
      </div>
      <strong>64%</strong>
    </section>
  </main>
</body>
</html>
