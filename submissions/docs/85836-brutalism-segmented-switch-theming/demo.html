<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Brutalism segmented switch theming demonstration.">
  <title>Brutalism Segmented Switch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #85836</p>
      <h1>Brutalism Segmented Switch</h1>
      <p>Themeable segmented controls using native buttons, custom properties, and clear selected states.</p>
    </header>
    <section class="demo-card" aria-labelledby="switch-title">
      <h2 id="switch-title">Display mode</h2>
      <p id="switch-help">Choose how the example content should be presented.</p>
      <div class="segmented-switch" role="group" aria-label="Display mode">
        <button class="segmented-switch__option segmented-switch__option--active" type="button" aria-pressed="true">Grid</button>
        <button class="segmented-switch__option" type="button" aria-pressed="false">List</button>
        <button class="segmented-switch__option" type="button" aria-pressed="false">Compact</button>
      </div>
    </section>
  </main>
</body>
</html>
