<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-only Breadcrumb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <p class="eyebrow">EaseMotion documentation</p>
    <h1>CSS-only Breadcrumb</h1>
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumbs">
        <li><a href="#home">Home</a></li>
        <li><a href="#components">Components</a></li>
        <li aria-current="page">Breadcrumb</li>
      </ol>
    </nav>
    <article>
      <h2>Current location</h2>
      <p>The breadcrumb communicates the page hierarchy using semantic HTML and CSS alone.</p>
    </article>
  </main>
</body>
</html>
